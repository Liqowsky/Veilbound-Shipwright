name: Veilbound Native Test Lab
on:
  push:
    branches:
      - veilbound/test-lab
  pull_request:
    branches:
      - veilbound/prologue-experiment
  workflow_dispatch:

permissions:
  contents: read

jobs:
  native-build:
    name: Build native OoT engine + title screen
    runs-on: ubuntu-22.04
    timeout-minutes: 90
    steps:
      - name: Checkout full native engine
        uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Generate native title texture header
        run: |
          sudo apt-get update
          sudo apt-get install -y python3-pil fonts-dejavu-core
          python3 tools/veilbound_build_title_art.py --header soh/src/overlays/actors/ovl_En_Mag/veilbound_title_button.h --master-dir build-veilbound-title-source
      - name: Validate native title integration
        run: |
          python3 -m py_compile tests/veilbound_title_guard.py
          python3 tests/veilbound_title_guard.py
      - name: Install documented Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y $(cat linux-build-deps/apt.txt)
      - name: Configure tools for native asset archive
        run: cmake -S . -B build-tools -G Ninja -DCMAKE_BUILD_TYPE=Release -DSOH_TOOLS_ONLY=ON
      - name: Build engine-owned archive
        run: cmake --build build-tools --target GenerateSohOtr -j4
      - name: Configure native game build
        run: cmake -S . -B build-native -G Ninja -DCMAKE_BUILD_TYPE=Release
      - name: Compile and link native game
        run: cmake --build build-native -j4
      - name: Package compiled Linux binary for inspection
        if: success()
        run: |
          mkdir -p build-output
          find build-native -type f -executable ! -name '*.so' ! -name '*.a' -size +1M -exec cp -v {} build-output/ \; || true
          find build-output -type f -maxdepth 1 -print
          test -n "$(find build-output -type f -maxdepth 1 -print -quit)"
      - name: Upload native test build
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: veilbound-native-linux-build
          path: build-output/
          if-no-files-found: error
      - name: Record build provenance
        if: always()
        run: |
          echo "Repository: $GITHUB_REPOSITORY" >> "$GITHUB_STEP_SUMMARY"
          echo "Source revision: $GITHUB_SHA" >> "$GITHUB_STEP_SUMMARY"
          echo "Platform: Linux native (NOT Android APK)" >> "$GITHUB_STEP_SUMMARY"
          echo "A successful compile DOES NOT prove title-screen visuals." >> "$GITHUB_STEP_SUMMARY"
