name: VEILBOUND — Blender Vaeloria Cove (true 3D)
on:
  workflow_dispatch:
  push:
    branches: [veilbound/test-lab]
    paths:
      - '.github/workflows/veilbound-vaeloria-blender.yml'
      - 'tools/build_vaeloria_cove_blender.py'
permissions:
  contents: read
jobs:
  cove-render:
    runs-on: ubuntu-24.04
    timeout-minutes: 65
    steps:
      - uses: actions/checkout@v4
      - name: Install Blender
        run: sudo apt-get update && sudo apt-get install -y blender
      - name: Download CC0 Kenney Retro Medieval 3D asset pack
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$GITHUB_WORKSPACE/veilbound-assets"
          curl -fL --retry 3 --connect-timeout 20 \
            "https://opengameart.org/sites/default/files/kenney_retro-medieval-kit.zip" \
            -o "$RUNNER_TEMP/kenney_retro-medieval-kit.zip"
          unzip -q "$RUNNER_TEMP/kenney_retro-medieval-kit.zip" -d "$GITHUB_WORKSPACE/veilbound-assets"
          find "$GITHUB_WORKSPACE/veilbound-assets" -iname '*.glb' | head -n 8
          test "$(find "$GITHUB_WORKSPACE/veilbound-assets" -iname '*.glb' | wc -l)" -gt 0
      - name: Create genuine editable Blender scene and render
        env:
          VAELORIA_OUT: ${{ github.workspace }}/vaeloria-output
          VAELORIA_ASSETS: ${{ github.workspace }}/veilbound-assets
        run: blender --background --threads 4 --python tools/build_vaeloria_cove_blender.py
      - name: Publish project and image
        uses: actions/upload-artifact@v4
        with:
          name: VAELORIA-BLENDER-COVE-AND-RENDER
          path: vaeloria-output/
          if-no-files-found: error
