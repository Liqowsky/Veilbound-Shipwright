name: VEILBOUND — Blender Vaeloria Cove (true 3D)
on:
  workflow_dispatch:
  push:
    branches: [veilbound/test-lab]
    paths:
      - '.github/workflows/veilbound-vaeloria-blender.yml'
      - 'tools/build_vaeloria_cove_blender.py'
permissions:
  contents: read
jobs:
  cove-render:
    runs-on: ubuntu-24.04
    timeout-minutes: 65
    steps:
      - uses: actions/checkout@v4
      - name: Install Blender
        run: sudo apt-get update && sudo apt-get install -y blender
      - name: Fetch free CC0 village and coastal models from OpenGameArt
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$GITHUB_WORKSPACE/veilbound-assets/village" "$GITHUB_WORKSPACE/veilbound-assets/coastal"
          curl --fail --location --retry 3 --connect-timeout 25 --max-time 180 \
            "https://opengameart.org/sites/default/files/medieval_village_pack_-_dec_2020.zip" \
            -o "$RUNNER_TEMP/quaternius_village.zip"
          curl --fail --location --retry 3 --connect-timeout 25 --max-time 180 \
            "https://opengameart.org/sites/default/files/kenney_pirate-kit_2.1.zip" \
            -o "$RUNNER_TEMP/kenney_coastal.zip"
          unzip -t "$RUNNER_TEMP/quaternius_village.zip" >/dev/null
          unzip -t "$RUNNER_TEMP/kenney_coastal.zip" >/dev/null
          unzip -q "$RUNNER_TEMP/quaternius_village.zip" -d "$GITHUB_WORKSPACE/veilbound-assets/village"
          unzip -q "$RUNNER_TEMP/kenney_coastal.zip" -d "$GITHUB_WORKSPACE/veilbound-assets/coastal"
          echo "Model samples:"
          find "$GITHUB_WORKSPACE/veilbound-assets" -type f | grep -Ei '\\.(obj|gltf|glb)$' | head -n 35 || true
          count=$(find "$GITHUB_WORKSPACE/veilbound-assets" -type f \\( -iname '*.obj' -o -iname '*.gltf' -o -iname '*.glb' \\) | wc -l)
          test "$count" -gt 5
          echo "Verified $count imported-source models"
      - name: Create genuine editable Blender scene and render
        env:
          VAELORIA_OUT: ${{ github.workspace }}/vaeloria-output
          VAELORIA_CC0_ASSETS: ${{ github.workspace }}/veilbound-assets
        run: blender --background --threads 4 --python tools/build_vaeloria_cove_blender.py
      - name: Publish project and image
        uses: actions/upload-artifact@v4
        with:
          name: VAELORIA-BLENDER-COVE-AND-RENDER
          path: vaeloria-output/
          if-no-files-found: error
