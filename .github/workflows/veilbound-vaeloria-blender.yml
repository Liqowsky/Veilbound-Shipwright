name: VEILBOUND — Cove V2 from scratch
on:
  workflow_dispatch:
  push:
    branches: [veilbound/test-lab]
    paths:
      - '.github/workflows/veilbound-vaeloria-blender.yml'
      - 'tools/vaeloria_cove_v2.py'
permissions:
  contents: read
jobs:
  fresh-cove:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - name: Install Blender from official standalone archive
        shell: bash
        run: |
          set -euo pipefail
          curl -fL --retry 3 --connect-timeout 20 --max-time 240 https://download.blender.org/release/Blender4.2/blender-4.2.9-linux-x64.tar.xz -o /tmp/blender.tar.xz
          mkdir -p "$RUNNER_TEMP/blender-bin"
          tar -xJf /tmp/blender.tar.xz -C "$RUNNER_TEMP/blender-bin" --strip-components=1
          "$RUNNER_TEMP/blender-bin/blender" --background --factory-startup --python-expr 'import bpy; print(bpy.app.version_string)'
      - name: Build NEW Vaeloria scene from scratch
        env:
          VAELORIA_OUT: ${{ github.workspace }}/vaeloria-output
        run: "$RUNNER_TEMP/blender-bin/blender" --background --threads 4 --python tools/vaeloria_cove_v2.py
      - name: Verify new .blend and actual Blender render
        run: |
          test -s vaeloria-output/VAELORIA_COVE_V2.blend
          test -s vaeloria-output/VAELORIA_COVE_V2_RENDER.png
      - name: Publish 3D model and image
        uses: actions/upload-artifact@v4
        with:
          name: VAELORIA-FRESH-COVE-V2-3D
          path: vaeloria-output/
          if-no-files-found: error
