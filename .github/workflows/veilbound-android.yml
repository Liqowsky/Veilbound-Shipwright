name: VEILBOUND Android APK (experimental)
# Full native build is deliberately manual until compiler root cause is resolved.
# Avoid burning 30+ minutes on each workflow edit.
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  android-apk:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - name: Checkout VEILBOUND native title edits
        uses: actions/checkout@v4
        with:
          path: veilbound
      - name: Checkout existing Android port including submodules
        uses: actions/checkout@v4
        with:
          repository: linkzenic/Shipwright-Android
          ref: main
          path: android-port
          submodules: recursive
      - name: Copy only VEILBOUND title actor into port
        run: |
          cp veilbound/soh/src/overlays/actors/ovl_En_Mag/z_en_mag.c android-port/soh/src/overlays/actors/ovl_En_Mag/z_en_mag.c
          grep -q 'VEILBOUND native title' android-port/soh/src/overlays/actors/ovl_En_Mag/z_en_mag.c
      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Use preinstalled Android SDK and install required packages
        shell: bash
        run: |
          set -euxo pipefail
          echo "ANDROID_HOME=${ANDROID_HOME:-unset}"
          echo "ANDROID_SDK_ROOT=${ANDROID_SDK_ROOT:-unset}"
          SDKROOT="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          test -d "$SDKROOT"
          export ANDROID_HOME="$SDKROOT"
          export ANDROID_SDK_ROOT="$SDKROOT"
          SDKMANAGER="$SDKROOT/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "$SDKMANAGER" ]; then SDKMANAGER="$(command -v sdkmanager)"; fi
          printf 'y\\n' | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" --install "platforms;android-31" "build-tools;35.0.0" "ndk;26.0.10792818" "cmake;3.31.5"
      - name: Fix Android SDK and NDK paths for Gradle
        shell: bash
        run: |
          set -euxo pipefail
          SDKROOT="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          NDKROOT="$SDKROOT/ndk/26.0.10792818"
          test -f "$NDKROOT/source.properties"
          test -d "$SDKROOT/platforms/android-31"
          printf 'sdk.dir=%s\\nndk.dir=%s\\n' "$SDKROOT" "$NDKROOT" > android-port/Android/local.properties
          cat android-port/Android/local.properties
      - name: Install Linux build prerequisites
        run: |
          sudo apt-get update
          sudo apt-get install -y ccache ninja-build cmake pkg-config libgl1-mesa-dev libglu1-mesa-dev libusb-1.0-0-dev libpng-dev libzip-dev libogg-dev libvorbis-dev libopus-dev
      - name: Restore native compilation cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ccache
          key: veilbound-android-ccache-v1-${{ runner.os }}-${{ github.run_id }}
          restore-keys: |
            veilbound-android-ccache-v1-${{ runner.os }}-
      - name: Configure C/C++ compilation cache
        shell: bash
        run: |
          ccache --set-config=max_size=1G
          ccache --zero-stats
          ccache --show-config | grep -E 'cache_dir|max_size' || true
      - name: Build VEILBOUND standalone debug APK
        working-directory: android-port/Android
        shell: bash
        env:
          CMAKE_C_COMPILER_LAUNCHER: ccache
          CMAKE_CXX_COMPILER_LAUNCHER: ccache
          CMAKE_BUILD_PARALLEL_LEVEL: '2'
          CCACHE_BASEDIR: ${{ github.workspace }}/android-port
          CCACHE_COMPILERCHECK: content
        run: |
          set -o pipefail
          chmod +x ./gradlew
          ./gradlew :app:assembleDebug --no-daemon --console plain --warning-mode summary -PsohApplicationId=com.anekstudios.veilbound 2>&1 | tee "$GITHUB_WORKSPACE/veilbound-android-gradle.log"
      - name: Compiler cache statistics
        if: always()
        run: ccache --show-stats || true
      - name: Show root native compiler failure
        if: failure()
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          p = Path('veilbound-android-gradle.log')
          if not p.exists():
              print('No Gradle log: failure happened before native compilation')
              raise SystemExit(0)
          data = p.read_text(errors='replace')
          lines = data.splitlines()
          # Gradle bundles the entire failed Ninja output as one multiline exception.
          # Focus on actual compiler diagnostics, not the generic Gradle wrapper failure.
          patterns = [
              r'(?m)^FAILED: .+$',
              r'(?m)^([^\\n]{0,250}):([0-9]+):([0-9]+): (?:fatal )?error: .+$',
              r'(?m)^([^\\n]{0,250}):([0-9]+): (?:fatal )?error: .+$',
              r'(?m)^ld\\.lld: error: .+$',
              r'(?m)^ninja: (?:fatal|error): .+$',
              r'(?m)^.*(?:No space left on device|Killed signal terminated program|out of memory|ninja: build stopped).*$', 
          ]
          hits=[]
          for regex in patterns:
              for m in re.finditer(regex,data):
                  line=data.count('\\n',0,m.start())
                  hits.append((line,m.group(0)[:700]))
          hits=sorted(set(hits))
          print(f'Total lines: {len(lines)}; actual compiler/linker indicators: {len(hits)}')
          for line,msg in hits[:30]:
              print(f'=== SOURCE LINE {line+1} ===')
              print(msg)
              print('\\n'.join(lines[max(0,line-2):min(len(lines),line+12)])[:3500])
          if not hits:
              print('No explicit compiler error recognized. Last 1300 chars before Gradle FAILURE:')
              pivot=data.rfind('FAILURE: Build failed')
              print(data[max(0,pivot-1300):pivot+150] if pivot>=0 else data[-3000:])
          PY
      - name: Upload diagnostics on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: VEILBOUND-Android-BUILD-ERROR-LOG
          path: veilbound-android-gradle.log
          if-no-files-found: warn
      - name: Validate APK output
        run: |
          find android-port/Android/app/build/outputs/apk/debug -type f -name '*.apk' -print
          test -n "$(find android-port/Android/app/build/outputs/apk/debug -name '*.apk' -print -quit)"
      - name: Upload VEILBOUND Android APK
        uses: actions/upload-artifact@v4
        with:
          name: VEILBOUND-Android-debug-APK
          path: android-port/Android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
      - name: Build summary
        if: always()
        run: |
          echo "VEILBOUND title actor from $GITHUB_SHA" >> "$GITHUB_STEP_SUMMARY"
          echo "Uses linkzenic Android port; this workflow builds APK, not a proof of in-game rendering." >> "$GITHUB_STEP_SUMMARY"
