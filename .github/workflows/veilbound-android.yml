name: VEILBOUND Android APK (experimental)
on:
  workflow_dispatch:
  push:
    branches:
      - veilbound/test-lab
    paths:
      - 'soh/src/overlays/actors/ovl_En_Mag/z_en_mag.c'
      - '.github/workflows/veilbound-android.yml'
permissions:
  contents: read
jobs:
  android-apk:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - name: Checkout VEILBOUND native title edits
        uses: actions/checkout@v4
        with:
          path: veilbound
      - name: Checkout existing Android port including submodules
        uses: actions/checkout@v4
        with:
          repository: linkzenic/Shipwright-Android
          ref: main
          path: android-port
          submodules: recursive
      - name: Copy only VEILBOUND title actor into port
        run: |
          cp veilbound/soh/src/overlays/actors/ovl_En_Mag/z_en_mag.c android-port/soh/src/overlays/actors/ovl_En_Mag/z_en_mag.c
          grep -q 'VEILBOUND native title' android-port/soh/src/overlays/actors/ovl_En_Mag/z_en_mag.c
      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Use preinstalled Android SDK and install required packages
        shell: bash
        run: |
          set -euxo pipefail
          echo "ANDROID_HOME=${ANDROID_HOME:-unset}"
          echo "ANDROID_SDK_ROOT=${ANDROID_SDK_ROOT:-unset}"
          SDKROOT="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          test -d "$SDKROOT"
          export ANDROID_HOME="$SDKROOT"
          export ANDROID_SDK_ROOT="$SDKROOT"
          SDKMANAGER="$SDKROOT/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "$SDKMANAGER" ]; then SDKMANAGER="$(command -v sdkmanager)"; fi
          printf 'y\\n' | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" --install "platforms;android-31" "build-tools;35.0.0" "ndk;26.0.10792818" "cmake;3.31.5"
      - name: Fix Android SDK and NDK paths for Gradle
        shell: bash
        run: |
          set -euxo pipefail
          SDKROOT="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          NDKROOT="$SDKROOT/ndk/26.0.10792818"
          test -f "$NDKROOT/source.properties"
          test -d "$SDKROOT/platforms/android-31"
          printf 'sdk.dir=%s\\nndk.dir=%s\\n' "$SDKROOT" "$NDKROOT" > android-port/Android/local.properties
          cat android-port/Android/local.properties
      - name: Install Linux build prerequisites
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build cmake pkg-config libgl1-mesa-dev libglu1-mesa-dev libusb-1.0-0-dev libpng-dev libzip-dev libogg-dev libvorbis-dev libopus-dev
      - name: Build VEILBOUND standalone debug APK
        working-directory: android-port/Android
        shell: bash
        run: |
          set -o pipefail
          chmod +x ./gradlew
          ./gradlew :app:assembleDebug --no-daemon --console plain --warning-mode summary -PsohApplicationId=com.anekstudios.veilbound 2>&1 | tee "$GITHUB_WORKSPACE/veilbound-android-gradle.log"
      - name: Show actual Gradle error summary
        if: failure()
        shell: bash
        run: |
          echo '=== GRADLE FAILURE DIAGNOSTICS ==='
          if [ -f veilbound-android-gradle.log ]; then
            grep -n -A 18 -B 5 -E '^FAILURE:|^\\* What went wrong:|^\\* Where:|^> |^Caused by:|^Could not|^Execution failed|^e: |^CMake Error|^error:|^ERROR:' veilbound-android-gradle.log | tail -n 200 || true
            echo '=== LOG TAIL ==='
            tail -n 100 veilbound-android-gradle.log
          else
            echo 'Gradle log missing; the job failed before Gradle completed.'
          fi
      - name: Upload diagnostics on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: VEILBOUND-Android-BUILD-ERROR-LOG
          path: veilbound-android-gradle.log
          if-no-files-found: warn
      - name: Validate APK output
        run: |
          find android-port/Android/app/build/outputs/apk/debug -type f -name '*.apk' -print
          test -n "$(find android-port/Android/app/build/outputs/apk/debug -name '*.apk' -print -quit)"
      - name: Upload VEILBOUND Android APK
        uses: actions/upload-artifact@v4
        with:
          name: VEILBOUND-Android-debug-APK
          path: android-port/Android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
      - name: Build summary
        if: always()
        run: |
          echo "VEILBOUND title actor from $GITHUB_SHA" >> "$GITHUB_STEP_SUMMARY"
          echo "Uses linkzenic Android port; this workflow builds APK, not a proof of in-game rendering." >> "$GITHUB_STEP_SUMMARY"
