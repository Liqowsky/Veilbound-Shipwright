name: Veilbound Android port feasibility
on:
  workflow_dispatch:
  push:
    branches:
      - veilbound/prologue-experiment
    paths:
      - '.github/workflows/veilbound-android-probe.yml'
      - 'soh/soh/Veilbound/**'

jobs:
  android-debug:
    runs-on: ubuntu-24.04
    timeout-minutes: 75
    container:
      image: djvdw7f2ro/android-builder-soh:v1.0.4
    permissions:
      contents: read
    steps:
      - name: Checkout Veilbound experiments
        uses: actions/checkout@v4
        with:
          path: veilbound
      - name: Checkout Android port as separate source
        uses: actions/checkout@v4
        with:
          repository: linkzenic/Shipwright-Android
          ref: main
          path: android-port
          submodules: recursive
      - name: Replace native Ocarina of Time title state
        shell: bash
        run: |
          set -euo pipefail
          cp veilbound/soh/src/overlays/gamestates/ovl_title/z_title.c \
             android-port/soh/src/overlays/gamestates/ovl_title/z_title.c
          cp veilbound/soh/src/overlays/actors/ovl_En_Mag/z_en_mag.c \
             android-port/soh/src/overlays/actors/ovl_En_Mag/z_en_mag.c
          echo "Patched original OoT En_Mag actor responsible for the Zelda title screen"
      - name: Set Android SDK properties
        working-directory: android-port
        shell: bash
        run: |
          echo "sdk.dir=${ANDROID_SDK_ROOT}" > Android/local.properties
          echo "ndk.dir=${ANDROID_NDK_HOME}" >> Android/local.properties
      - name: Install required host build dependencies
        working-directory: android-port
        shell: bash
        run: |
          apt-get update
          apt-get install -y $(cat .github/workflows/apt-deps.txt)
      - name: Generate required non-Nintendo engine resource archive
        working-directory: android-port
        shell: bash
        run: |
          cmake -S . -B build-linux -G Ninja -DCMAKE_BUILD_TYPE=Release
          cmake --build build-linux --target GenerateSohOtr --parallel 4
          cp soh/soh.o2r Android/app/src/main/assets/soh.o2r
      - name: Build unsigned-for-release debug APK
        working-directory: android-port/Android
        shell: bash
        run: |
          chmod +x ./gradlew
          ./gradlew assembleDebug --no-daemon
      - name: Publish test APK
        uses: actions/upload-artifact@v4
        with:
          name: veilbound-android-experiment
          path: android-port/Android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 7
